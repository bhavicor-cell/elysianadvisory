<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Under Maintenance</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", sans-serif;
    }

    body {
      background: #0A0A0A;
      color: #EAEAEA;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      color: #C2A869;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.1rem;
      color: #AAAAAA;
      line-height: 1.6;
    }

    .line {
      width: 60px;
      height: 2px;
      background: #C2A869;
      margin: 20px auto;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Temporarily Unavailable</h1>
    <div class="line"></div>
    <p>
      We’re making some improvements behind the scenes.<br/>
      Please check back shortly.
    </p>
  </div>
</body>
</html>
